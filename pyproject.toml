[project]
name = "pqtools"
version = "0.1.0"
description = ""
authors = [
    {name = "Stefano Piani",email = "spiani@ogs.it"}
]
readme = "README.md"
requires-python = "^3.12"
dependencies = [
    "bitsea @ file:///home/spiani/projects/bit.sea",
    "copernicusmarine (>=2.5.1,<3.0.0)",
    "python-dateutil (>=2.9,<3)",
    "xarray (>=2026.9.0,<2027.0.0)",
    "pandas (>=3.1.1,<4.0.0)"
]

[project.scripts]
pqtools = "pqtools.__main__:main"

[tool.poetry]
packages = [{include = "pqtools", from = "src"}]

[tool.poetry.dependencies]
bitsea = {develop = true}
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
