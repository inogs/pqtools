[project]
name = "pqtools"
version = "0.1.0"
description = ""
authors = [
    {name = "Stefano Piani",email = "spiani@ogs.it"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "bitsea @ git+https://github.com/inogs/bit.sea.git",
    "copernicusmarine (>=2.5.1,<3.0.0)",
    "python-dateutil (>=2.9,<3)",
    "xarray (>=2026.9.0,<2027.0.0)",
    "pandas (>=3.1.1,<4.0.0)",
    "numpy (>=2.5.5,<3.0.0)",
    "xarray-regrid (>=0.4.2,<0.5.0)"
]

[project.scripts]
pqtools = "pqtools.__main__:main"

[tool.poetry]
packages = [{include = "pqtools", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.7.0,<5.0.0)",
    "deptry (>=0.25.1,<0.26.0)"
]


[tool.deptry.per_rule_ignores]
DEP002 = ["python-dateutil"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.ruff]
line-length = 79

[tool.ruff.lint.isort]
force-single-line = true
